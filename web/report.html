<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1116">
<meta name="referrer" content="no-referrer">
<title>SafeStop · Incident report</title>
<link rel="stylesheet" href="/style.css">
<style>
  @media print { body { background: #fff; color: #000; } .card { border-color: #999; background: #fff; } .noprint { display: none; } .muted, .faint, .timeline { color: #333; } }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  code { font-size: 11px; word-break: break-all; color: var(--faint); }
</style>
</head>
<body>
<main>
  <div class="top"><h1>Incident report</h1><span class="tag">Private · yours to share</span></div>
  <p class="muted">Only you can open this page. Share or print it only if you choose to, for example with family, an insurer or the police.</p>
  <div class="row noprint" style="margin:10px 0"><select id="pick" aria-label="Choose an incident"></select><button id="print">Print / save as PDF</button></div>
  <div id="body"><p class="muted">Loading…</p></div>
</main>
<script>
(() => {
  const key = decodeURIComponent(location.hash.slice(1));
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const t = (ms) => new Date(ms).toLocaleString();
  const api = (p) => fetch(p, { headers: { 'x-traveller-key': key } }).then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))));
  $('print').onclick = () => print();

  api('/api/incidents').then(({ incidents }) => {
    if (!incidents.length) return ($('body').innerHTML = '<p class="muted">No incidents yet.</p>');
    $('pick').innerHTML = incidents.map((i) => `<option value="${i.id}">${t(i.createdAt)} · ${i.status}</option>`).join('');
    $('pick').onchange = () => load($('pick').value);
    load(incidents[0].id);
  }).catch(() => ($('body').innerHTML = '<p class="muted">Open this page with your traveller link (it ends with #tk_…).</p>'));

  function load(id) {
    api(`/api/incident/${id}/report`).then(({ incident: i, evidence, verified }) => {
      const loc = i.location;
      const facts = Object.entries(i.facts || {}).map(([k, v]) => `${k}: ${esc(v)}`).join(' · ');
      $('body').innerHTML = `
        <div class="card">
          <p><b>${esc(i.traveller)}</b> · started ${t(i.createdAt)}${i.pressedAt && i.createdAt - i.pressedAt > 2000 ? ` (pressed ${t(i.pressedAt)}, no signal until then)` : ''} via ${esc(i.trigger)}</p>
          <p>Status: <b>${esc(i.status)}</b>${i.safeConfirmedAt ? ` · confirmed safe ${t(i.safeConfirmedAt)}` : ''}${i.resolvedAt && !i.safeConfirmedAt ? ` · closed ${t(i.resolvedAt)} (she did not confirm safe)` : ''}</p>
          ${i.playbook ? `<p>Situation reported: ${esc(i.playbook.title)}${i.severity ? ` · severity ${esc(i.severity)}` : ''}</p>` : ''}
          ${facts ? `<p>Details she gave: ${facts}</p>` : ''}
          ${loc ? `<p>Last location: ${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}${loc.accuracyM ? ` ±${Math.round(loc.accuracyM)} m` : ''} at ${t(loc.at)} · <a href="https://www.openstreetmap.org/?mlat=${loc.lat}&mlon=${loc.lon}#map=16/${loc.lat}/${loc.lon}">map</a></p>` : '<p>No location was shared.</p>'}
        </div>
        <h2>Who knew, and when</h2>
        <div class="card"><table><tr><th>Contact</th><th>Sent</th><th>Delivered</th><th>Acknowledged</th><th>Phone call</th></tr>
          ${i.contacts.map((c) => `<tr><td>${esc(c.name)}</td><td>${t(c.sentAt)}</td><td>${c.deliveredAt ? t(c.deliveredAt) : '—'}</td><td>${c.ackAt ? `${t(c.ackAt)} (${c.channel === 'call' ? 'phone' : 'page'})` : '—'}</td><td>${c.call ? esc(c.call.state) + (c.call.said ? ` “${esc(c.call.said)}”` : '') : '—'}</td></tr>`).join('')}
        </table></div>
        <h2>Evidence log</h2>
        <div class="card">
          <p class="${verified ? '' : 'banner alarm'}">Hash chain ${verified ? 'verified: no entry has been changed or removed since it was written.' : 'BROKEN: an entry was changed after it was written.'}</p>
          <table><tr><th>Time</th><th>What</th><th>Hash</th></tr>
          ${evidence.map((e) => `<tr><td>${t(e.at)}</td><td>${esc(e.kind)}: ${esc(e.text)}</td><td><code>${e.hash.slice(0, 16)}…</code></td></tr>`).join('')}
          </table>
        </div>
        <p class="faint">Generated by SafeStop ${t(Date.now())}. SafeStop is not an emergency service; it records what it did and what it was told.</p>`;
    });
  }
})();
</script>
</body>
</html>
